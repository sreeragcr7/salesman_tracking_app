name: salesman_tracking_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  cupertino_icons: ^1.0.9
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_map: ^8.3.2
  flutter_native_splash: ^2.4.7
  fpdart: ^1.2.0
  geolocator: ^14.0.3
  get_it: ^9.3.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  permission_handler: 11.3.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  video_player: ^2.11.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#061B5C"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logos/app_logo.png

  android: true
  ios: false

  android_12:
    color: "#FFFFFF"
    image: assets/logos/app_logo.png